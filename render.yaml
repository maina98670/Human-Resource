services:
  # ─── FastAPI Web Service ───────────────────────────────────────────────────
  - type: web
    name: hospital-hr-api
    env: python
    plan: starter
    rootDir: backend
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-hr-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: hospital-hr-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hospital-hr-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: hospital-hr-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: hospital-hr-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "https://hospital-hr-frontend.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ─── Celery Worker ────────────────────────────────────────────────────────
  - type: worker
    name: hospital-hr-worker
    env: python
    plan: starter
    rootDir: backend
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks.celery_tasks.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - fromGroup: hospital-hr-env

  # ─── Celery Beat (Scheduler) ──────────────────────────────────────────────
  - type: worker
    name: hospital-hr-beat
    env: python
    plan: starter
    rootDir: backend
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks.celery_tasks.celery_app beat --loglevel=info
    envVars:
      - fromGroup: hospital-hr-env

  # ─── React Frontend (Static Site) ─────────────────────────────────────────
  - type: web
    name: hospital-hr-frontend
    env: static
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hospital-hr-api
          type: web
          property: host
          transform: "https://{host}/api/v1"

databases:
  - name: hospital-hr-db
    plan: starter
    databaseName: hospital_hr
    user: hospital_hr_user

  - name: hospital-hr-redis
    type: redis
    plan: starter

envVarGroups:
  - name: hospital-hr-env
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-hr-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: hospital-hr-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hospital-hr-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: hospital-hr-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: hospital-hr-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "https://hospital-hr-frontend.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
